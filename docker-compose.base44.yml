services:
  storybook:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - storybook_node_modules:/app/node_modules
    ports:
      - "3000:6006"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm ci && exec npx storybook dev -p 6006 --ci --host 0.0.0.0"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:6006/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: on-failure

volumes:
  storybook_node_modules:
